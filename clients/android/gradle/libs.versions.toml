[versions]
agp                 = "8.5.2"
kotlin              = "2.0.21"
coreKtx             = "1.13.1"
lifecycleRuntime    = "2.8.6"
activityCompose     = "1.9.2"
composeBom          = "2024.09.03"
grpc                = "1.66.0"
grpcKotlin          = "1.4.1"
protobuf            = "4.28.2"
protobufPlugin      = "0.9.4"
coroutines          = "1.9.0"
mockk               = "1.13.12"
junitKtx            = "1.2.1"

[libraries]
# AndroidX
androidx-core-ktx              = { group = "androidx.core",             name = "core-ktx",                    version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle",        name = "lifecycle-runtime-ktx",        version.ref = "lifecycleRuntime" }
androidx-lifecycle-viewmodel   = { group = "androidx.lifecycle",        name = "lifecycle-viewmodel-compose",  version.ref = "lifecycleRuntime" }
androidx-activity-compose      = { group = "androidx.activity",         name = "activity-compose",             version.ref = "activityCompose" }

# Compose BOM
compose-bom    = { group = "androidx.compose",  name = "compose-bom",    version.ref = "composeBom" }
compose-ui     = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling         = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-material3          = { group = "androidx.compose.material3", name = "material3" }
compose-graphics           = { group = "androidx.compose.ui", name = "ui-graphics" }

# gRPC
grpc-okhttp        = { group = "io.grpc", name = "grpc-okhttp",        version.ref = "grpc" }
grpc-protobuf-lite = { group = "io.grpc", name = "grpc-protobuf-lite", version.ref = "grpc" }
grpc-stub          = { group = "io.grpc", name = "grpc-stub",          version.ref = "grpc" }
grpc-kotlin-stub   = { group = "io.grpc", name = "grpc-kotlin-stub",   version.ref = "grpcKotlin" }
protobuf-kotlin-lite = { group = "com.google.protobuf", name = "protobuf-kotlin-lite", version.ref = "protobuf" }

# Coroutines
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# Testing
junit              = { group = "junit",             name = "junit",                          version = "4.13.2" }
junit-ktx          = { group = "androidx.test.ext", name = "junit-ktx",                     version.ref = "junitKtx" }
mockk              = { group = "io.mockk",          name = "mockk",                          version.ref = "mockk" }
coroutines-test    = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test",   version.ref = "coroutines" }

[plugins]
android-application = { id = "com.android.application",               version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android",          version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose",   version.ref = "kotlin" }
protobuf            = { id = "com.google.protobuf",                    version.ref = "protobufPlugin" }
