version: v2

managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/rkrimper1/jarvis/api/pb
      path: proto

plugins:
# ── Go: protobuf messages ──────────────────────────────────────────
  - remote: buf.build/protocolbuffers/go
    out: api
    opt:
      - paths=source_relative

  # ── Go: gRPC service stubs ─────────────────────────────────────────
  - remote: buf.build/grpc/go
    out: api
    opt:
      - paths=source_relative

  # ── Swift: protobuf messages → gen/swift/ (iOS JarvisClient) ──────
  # Consumed by clients/ios/JarvisClient/Package.swift JarvisProto target.
  - remote: buf.build/apple/swift
    out: gen/swift
    opt:
      - Visibility=Public

  # ── Swift: gRPC client stubs → gen/swift/ (client-side only) ──────
  - remote: buf.build/grpc/swift
    out: gen/swift
    opt:
      - Visibility=Public
      - Client=true
      - Server=false   # iOS never runs the gRPC server

  # ── Go: grpc-gateway HTTP transcoding ─────────────────────────────
  - remote: buf.build/grpc-ecosystem/gateway
    out: api
    opt:
      - paths=source_relative

  # ── Go: OpenAPI v2 docs ───────────────────────────────────────────
  - remote: buf.build/grpc-ecosystem/openapiv2
    out: docs/openapi
    opt:
      - allow_merge=true
      - merge_file_name=jarvis

inputs:
  - directory: proto
    exclude_paths:
      - proto/pb/agent
      - proto/pb/hardware
