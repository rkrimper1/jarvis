version: v2

managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/rkrimper1/jarvis/gen
      path: proto

plugins:
  - remote: buf.build/protocolbuffers/go
    out: gen
    opt:
      - paths=source_relative

  - remote: buf.build/grpc/go
    out: gen
    opt:
      - paths=source_relative

  - remote: buf.build/grpc-ecosystem/gateway
    out: gen
    opt:
      - paths=source_relative

  - remote: buf.build/grpc-ecosystem/openapiv2
    out: docs/openapi
    opt:
      - allow_merge=true
      - merge_file_name=jarvis

inputs:
  - directory: proto
