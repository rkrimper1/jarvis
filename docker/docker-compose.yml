version: "3.8"

# ──────────────────────────────────────────────────────────────────────
#  JARVIS — Single binary, all services in one process
#
#  Ports:
#    :50051  gRPC  (all 9 services)
#    :8080   REST  (grpc-gateway HTTP transcoder)
#    :6379   Redis (session store — opt-in via SESSION_PROVIDER=redis)
#
#  Volumes:
#    ./profiles  →  /tmp/profiles  (heap profile .prof + .gif output)
# ──────────────────────────────────────────────────────────────────────

services:

  jarvis:
    build:
      context: ..
      dockerfile: docker/jarvis/Dockerfile
    env_file:
      - /home/vagrant/credentials/jarvis/.env
    environment:
      # ── Server ────────────────────────────────────────────────────
      - GRPC_PORT=50051
      - HTTP_PORT=8080
      - SHUTDOWN_TIMEOUT=10s
      - MAX_RECV_MSG_SIZE=8388608
      - MAX_SEND_MSG_SIZE=8388608
      - LOG_LEVEL=info

      # ── Security ──────────────────────────────────────────────────
      - TOKEN_SECRET=${JARVIS_TOKEN_SECRET:-jarvis-dev-secret-change-in-prod}

      # ── NLP / Dialogue ────────────────────────────────────────────
      - DIALOGUE_MAX_HISTORY=${DIALOGUE_MAX_HISTORY:-20}
      - DIALOGUE_SESSION_TTL=${DIALOGUE_SESSION_TTL:-30m}
      - DIALOGUE_CONFIDENCE_THRESH=${DIALOGUE_CONFIDENCE_THRESH:-0.6}

      # ── Claude AI (dialogue manager) ──────────────────────────────

      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-sonnet-4-6}
      - CLAUDE_MAX_TOKENS=${CLAUDE_MAX_TOKENS:-1024}

      # ── Session store ─────────────────────────────────────────────
      # SESSION_PROVIDER=memory  → zero-dep in-process store (default)
      # SESSION_PROVIDER=redis   → Redis-backed, survives restarts
      - SESSION_PROVIDER=${SESSION_PROVIDER:-memory}
      - SESSION_TTL=${SESSION_TTL:-30m}
      - SESSION_MAX=${SESSION_MAX:-1000}
      - REDIS_ADDR=${REDIS_ADDR:-redis:6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DB=${REDIS_DB:-0}

      # ── Audio ─────────────────────────────────────────────────────
      - AUDIO_SAMPLE_RATE_HZ=${AUDIO_SAMPLE_RATE_HZ:-16000}
      - AUDIO_CHUNK_DURATION_MS=${AUDIO_CHUNK_DURATION_MS:-20}
      - AUDIO_VAD_SILENCE_MS=${AUDIO_VAD_SILENCE_MS:-800}
      - AUDIO_MAX_UTTERANCE_SEC=${AUDIO_MAX_UTTERANCE_SEC:-30}

      # ── STT ───────────────────────────────────────────────────────
      - STT_PROVIDER=${STT_PROVIDER:-stub}
      - STT_MODEL=${STT_MODEL:-latest_long}
      - STT_AUTO_PUNCTUATION=${STT_AUTO_PUNCTUATION:-true}
      - STT_WORD_TIME_OFFSETS=${STT_WORD_TIME_OFFSETS:-false}
      - STT_MAX_SYNC_DURATION_SEC=${STT_MAX_SYNC_DURATION_SEC:-55}

      # ── TTS ───────────────────────────────────────────────────────
      - TTS_PROVIDER=${TTS_PROVIDER:-stub}
      - TTS_VOICE_ID=${TTS_VOICE_ID:-en-US-Journey-D}
      - TTS_LANGUAGE_CODE=${TTS_LANGUAGE_CODE:-en-US}
      - TTS_SPEAKING_RATE=${TTS_SPEAKING_RATE:-1.0}
      - TTS_PITCH=${TTS_PITCH:-0.0}
      - TTS_AUDIO_ENCODING=${TTS_AUDIO_ENCODING:-pcm}
      - TTS_CHUNK_SIZE_BYTES=${TTS_CHUNK_SIZE_BYTES:-8192}

      # ── GCP (shared by STT + TTS when provider != stub) ──────────
      - GCP_PROJECT=${GCP_PROJECT:-}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-}

      # ── Email / Calendar invites (optional) ──────────────────────
      # Set all five to enable calendar invite emails on ScheduleEvent.
      # SMTP_PASS should be a Gmail App Password (not your login password).
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_TO=${SMTP_TO:-}

      # ── Heap profiler ─────────────────────────────────────────────
      - PPROF_DIR=${PPROF_DIR:-/tmp/profiles}
      - PPROF_INTERVAL=${PPROF_INTERVAL:-5m}

      # ── Shared SQLite database ────────────────────────────────────
      # All stores (users, tasks, analytics, audit, knowledge) share one file.
      # Leave empty to disable SQLite persistence (uses in-memory fallbacks).
      - JARVIS_DB_PATH=${JARVIS_DB_PATH:-/home/vagrant/.jarvis/jarvis.db}

      # ── User store ────────────────────────────────────────────────
      - SEED_TONY_USER=${SEED_TONY_USER:-tony-stark}
      - SEED_TONY_PASSWORD=${SEED_TONY_PASSWORD:-tony-stark}
      - SEED_ADMIN_USER=${SEED_ADMIN_USER:-rob-krimper}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:-rob-krimper}

      # ── Knowledge base (Learning service) ────────────────────────
      - KNOWLEDGE_STALE_DAYS=${KNOWLEDGE_STALE_DAYS:-30}
      - KNOWLEDGE_WEB_SEARCH_MAX_USES=${KNOWLEDGE_WEB_SEARCH_MAX_USES:-10}

      # ── Face analysis (Security service) ─────────────────────────
      # Cascade is downloaded by setup.sh to ~/.jarvis/facefinder
      - FACE_CASCADE_PATH=${FACE_CASCADE_PATH:-/home/vagrant/.jarvis/facefinder}
      - FACE_OUTPUT_DIR=${FACE_OUTPUT_DIR:-/home/vagrant/.jarvis/faces}
      - FACE_MIN_SIZE=${FACE_MIN_SIZE:-65}
      - FACE_QUALITY_THRESHOLD=${FACE_QUALITY_THRESHOLD:-6.0}
      - FACE_CLUSTER_OVERLAP=${FACE_CLUSTER_OVERLAP:-0.25}
      - FACE_OUTPUT_TRIANGLE_SIZE=${FACE_OUTPUT_TRIANGLE_SIZE:-0}
      - FACE_OUTPUT_OPACITY=${FACE_OUTPUT_OPACITY:-0}
      - FACE_OUTPUT_FONT_SIZE=${FACE_OUTPUT_FONT_SIZE:-0}
      - FACE_MAX_IMAGE_BYTES=${FACE_MAX_IMAGE_BYTES:-0}

      # ── Alexa smart home ──────────────────────────────────────────
      - ALEXA_COOKIES_PATH=${ALEXA_COOKIES_PATH:-}
      - ALEXA_DEBUG=${ALEXA_DEBUG:-false}

      # ── Intel Hunt (fusion engine + RSS poller) ───────────────────
      # Requires ANTHROPIC_API_KEY and JARVIS_DB_PATH to activate.
      - FUSION_MODEL=${FUSION_MODEL:-claude-haiku-4-5-20251001}
      - FUSION_MAX_TOKENS=${FUSION_MAX_TOKENS:-512}
      - FUSION_CONF_IMMEDIATE=${FUSION_CONF_IMMEDIATE:-0.90}
      - FUSION_CONF_VERIFY=${FUSION_CONF_VERIFY:-0.70}
      - FUSION_CONF_REVIEW=${FUSION_CONF_REVIEW:-0.50}
      - RSS_FEED_URLS=${RSS_FEED_URLS:-}
      - RSS_POLL_INTERVAL=${RSS_POLL_INTERVAL:-15m}
    volumes:
      - ../profiles:/tmp/profiles
      - /home/vagrant/.jarvis:/home/vagrant/.jarvis
      - /home/vagrant/credentials/jarvis:/home/vagrant/credentials/jarvis
    ports:
      - "50051:50051"
      - "8080:8080"
    depends_on:
      - redis
    restart: unless-stopped

  # ── Redis — session store (opt-in via SESSION_PROVIDER=redis) ────────
  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
    ports:
      - "6379:6379"
    restart: unless-stopped
