version: "3.8"

# ──────────────────────────────────────────────────────────────────────
#  JARVIS gRPC Microservices — Full Stack
#
#  Compatible with docker-compose v1.29+ and docker compose v2+
#
#  Ports exposed to the host:
#    :8080  REST API  (Envoy → Go Gateway → gRPC services)
#    :8081  REST API  direct gateway access (bypass Envoy — dev only)
#    :9090  gRPC API  (Envoy passthrough → gRPC services)
#    :9901  Envoy admin dashboard
#    :50051-50058  individual gRPC services (dev only)
# ──────────────────────────────────────────────────────────────────────

services:

  # ── Envoy Proxy ──────────────────────────────────────────────────────
  envoy:
    image: envoyproxy/envoy:v1.29-latest
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "8080:8080"
      - "9090:9090"
      - "9901:9901"
    depends_on:
      - gateway
      - nlp-service
      - security-service
      - agent-coordinator
      - hardware-service
      - facility-service
      - intelligence-service
      - business-ops-service
      - learning-service
    restart: unless-stopped

  # ── API Gateway ───────────────────────────────────────────────────────
  gateway:
    build:
      context: ..
      dockerfile: docker/gateway/Dockerfile
    environment:
      - HTTP_PORT=8080
      - TOKEN_SECRET=${JARVIS_TOKEN_SECRET:-jarvis-dev-secret-change-in-prod}
      - CORS_ORIGINS=*
      - LOG_LEVEL=info
      - NLP_ADDR=nlp-service:50051
      - SECURITY_ADDR=security-service:50052
      - AGENT_ADDR=agent-coordinator:50053
      - HARDWARE_ADDR=hardware-service:50054
      - FACILITY_ADDR=facility-service:50055
      - INTELLIGENCE_ADDR=intelligence-service:50056
      - BUSINESS_ADDR=business-ops-service:50057
      - LEARNING_ADDR=learning-service:50058
      - DIAL_TIMEOUT=5s
    ports:
      - "8081:8080"
    depends_on:
      - nlp-service
      - security-service
      - agent-coordinator
      - hardware-service
      - facility-service
      - intelligence-service
      - business-ops-service
      - learning-service
    restart: unless-stopped

  # ── Core Services ─────────────────────────────────────────────────────

  nlp-service:
    build:
      context: ..
      dockerfile: docker/nlp-service/Dockerfile
    environment:
      - GRPC_PORT=50051
      - LOG_LEVEL=info
    ports:
      - "50051:50051"
    restart: unless-stopped

  security-service:
    build:
      context: ..
      dockerfile: docker/security-service/Dockerfile
    environment:
      - GRPC_PORT=50052
      - TOKEN_SECRET=${JARVIS_TOKEN_SECRET:-jarvis-dev-secret-change-in-prod}
      - LOG_LEVEL=info
    ports:
      - "50052:50052"
    restart: unless-stopped

  agent-coordinator:
    build:
      context: ..
      dockerfile: docker/agent-coordinator/Dockerfile
    environment:
      - GRPC_PORT=50053
      - LOG_LEVEL=info
    ports:
      - "50053:50053"
    restart: unless-stopped

  hardware-service:
    build:
      context: ..
      dockerfile: docker/hardware-service/Dockerfile
    environment:
      - GRPC_PORT=50054
      - LOG_LEVEL=info
    ports:
      - "50054:50054"
    restart: unless-stopped

  facility-service:
    build:
      context: ..
      dockerfile: docker/facility-service/Dockerfile
    environment:
      - GRPC_PORT=50055
      - LOG_LEVEL=info
    ports:
      - "50055:50055"
    restart: unless-stopped

  intelligence-service:
    build:
      context: ..
      dockerfile: docker/intelligence-service/Dockerfile
    environment:
      - GRPC_PORT=50056
      - LOG_LEVEL=info
    ports:
      - "50056:50056"
    restart: unless-stopped

  business-ops-service:
    build:
      context: ..
      dockerfile: docker/business-ops-service/Dockerfile
    environment:
      - GRPC_PORT=50057
      - LOG_LEVEL=info
    ports:
      - "50057:50057"
    restart: unless-stopped

  learning-service:
    build:
      context: ..
      dockerfile: docker/learning-service/Dockerfile
    environment:
      - GRPC_PORT=50058
      - LOG_LEVEL=info
    ports:
      - "50058:50058"
    restart: unless-stopped
