syntax = "proto3";
package jarvis.hardware;
option go_package = "github.com/rkrimper1/jarvis/api/pb/hardware";

import "pb/common/common.proto";
import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";

enum DeviceType {
  DEVICE_TYPE_UNSPECIFIED = 0;
  DEVICE_TYPE_IRON_SUIT   = 1;
  DEVICE_TYPE_ARC_REACTOR = 2;
  DEVICE_TYPE_SENSOR      = 3;
  DEVICE_TYPE_SATELLITE   = 4;
  DEVICE_TYPE_HUD         = 5;
}

enum PowerState {
  POWER_STATE_UNSPECIFIED = 0;
  POWER_STATE_OFF         = 1;
  POWER_STATE_STANDBY     = 2;
  POWER_STATE_ON          = 3;
  POWER_STATE_CRITICAL    = 4;
}

message Device {
  string     device_id    = 1;
  string     name         = 2;
  DeviceType type         = 3;
  PowerState power_state  = 4;
  float      power_level  = 5;
  string     firmware_ver = 6;
  string     location     = 7;
  google.protobuf.Timestamp last_sync = 8;
}

message TelemetryReading {
  string device_id   = 1;
  string sensor_type = 2;
  double value       = 3;
  string unit        = 4;
  jarvis.common.Severity alert_level = 5;
  google.protobuf.Timestamp timestamp = 6;
}

message SendCommandRequest {
  jarvis.common.RequestMeta meta = 1;
  string device_id               = 2;
  string command                 = 3;
  map<string, string> params     = 4;
}

message SendCommandResponse {
  jarvis.common.ResponseMeta meta = 1;
  string device_id                = 2;
  string command_executed         = 3;
  string result_detail            = 4;
}

message RunDiagnosticsRequest {
  jarvis.common.RequestMeta meta = 1;
  string device_id               = 2;
  bool   deep_scan               = 3;
}

message RunDiagnosticsResponse {
  jarvis.common.ResponseMeta meta  = 1;
  string device_id                 = 2;
  repeated string warnings         = 3;
  repeated string errors           = 4;
  float  overall_health_score      = 5;
  map<string, string> system_stats = 6;
}

message ScanEnergySourcesRequest {
  jarvis.common.RequestMeta meta = 1;
  string location                = 2;
  float  scan_radius_km          = 3;
}

message ScanEnergySourcesResponse {
  jarvis.common.ResponseMeta meta = 1;
  repeated EnergySource sources  = 2;
}

message EnergySource {
  string source_id   = 1;
  string type        = 2;
  float  power_level = 3;
  string location    = 4;
  bool   is_hostile  = 5;
}

message StreamTelemetryRequest {
  jarvis.common.RequestMeta meta = 1;
  string device_id               = 2;
}

message StreamTelemetryResponse {
  jarvis.common.ResponseMeta meta = 1;
  TelemetryReading reading        = 2;
}

message SuitControlStreamRequest {
  jarvis.common.RequestMeta meta = 1;
  string device_id               = 2;
  string command                 = 3;
  map<string, string> params     = 4;
}

message SuitControlStreamResponse {
  jarvis.common.ResponseMeta meta = 1;
  TelemetryReading reading        = 2;
}

service HardwareService {
  rpc SendCommand(SendCommandRequest) returns (SendCommandResponse) {
    option (google.api.http) = { post: "/v1/hardware/{device_id}/command" body: "*" };
  }
  rpc RunDiagnostics(RunDiagnosticsRequest) returns (RunDiagnosticsResponse) {
    option (google.api.http) = { get: "/v1/hardware/{device_id}/diagnostics" };
  }
  rpc ScanEnergySources(ScanEnergySourcesRequest) returns (ScanEnergySourcesResponse) {
    option (google.api.http) = { get: "/v1/hardware/energy/scan" };
  }
  rpc StreamTelemetry(StreamTelemetryRequest) returns (stream StreamTelemetryResponse);
  rpc SuitControlStream(stream SuitControlStreamRequest) returns (stream SuitControlStreamResponse);
}
