syntax = "proto3";
package jarvis.intelligence;
option go_package = "github.com/rkrimper1/jarvis/api/pb/intelligence";

import "pb/common/common.proto";
import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";

// ── Existing enums ────────────────────────────────────────────────────────────

enum SubjectType {
  SUBJECT_TYPE_UNSPECIFIED  = 0;
  SUBJECT_TYPE_PERSON       = 1;
  SUBJECT_TYPE_ORGANIZATION = 2;
  SUBJECT_TYPE_TECHNOLOGY   = 3;
  SUBJECT_TYPE_LOCATION     = 4;
  SUBJECT_TYPE_ARTIFACT     = 5;
}

enum AnalysisDepth {
  ANALYSIS_DEPTH_UNSPECIFIED = 0;
  ANALYSIS_DEPTH_STANDARD    = 1;
  ANALYSIS_DEPTH_DEEP        = 2;
}

// ── Intel Hunt enums ──────────────────────────────────────────────────────────

enum SourceType {
  SOURCE_TYPE_UNSPECIFIED = 0;
  SOURCE_TYPE_MANUAL      = 1;
  SOURCE_TYPE_RSS         = 2;
  SOURCE_TYPE_FILE_UPLOAD = 3;
}

enum OpportunityType {
  OPPORTUNITY_TYPE_UNSPECIFIED     = 0;
  OPPORTUNITY_TYPE_TACTICAL        = 1;
  OPPORTUNITY_TYPE_STRATEGIC       = 2;
  OPPORTUNITY_TYPE_RESOURCE        = 3;
  OPPORTUNITY_TYPE_THREAT_MITIGATION = 4;
}

enum IntelCardStatus {
  INTEL_CARD_STATUS_UNSPECIFIED  = 0;
  INTEL_CARD_STATUS_PENDING_REVIEW = 1;
  INTEL_CARD_STATUS_CONFIRMED    = 2;
  INTEL_CARD_STATUS_DISMISSED    = 3;
}

message QueryIntelRequest {
  jarvis.common.RequestMeta meta = 1;
  SubjectType   subject_type     = 2;
  string        query            = 3;
  AnalysisDepth depth            = 4;
  repeated string data_sources   = 5;
}

message IntelFact {
  string source      = 1;
  string fact        = 2;
  float  reliability = 3;
  google.protobuf.Timestamp recorded_at = 4;
}

message QueryIntelResponse {
  jarvis.common.ResponseMeta meta    = 1;
  string   subject_id                = 2;
  string   summary                   = 3;
  repeated IntelFact facts           = 4;
  repeated string related_subjects   = 5;
  float    confidence                = 6;
}

message AnalyzeArtifactRequest {
  jarvis.common.RequestMeta meta = 1;
  string artifact_id             = 2;
  bytes  scan_data               = 3;
  string artifact_description    = 4;
}

message AnalyzeArtifactResponse {
  jarvis.common.ResponseMeta meta           = 1;
  string  artifact_id                       = 2;
  string  composition_summary               = 3;
  bool    is_known_technology               = 4;
  bool    is_potentially_hostile            = 5;
  repeated string anomalies                 = 6;
  map<string, double> element_breakdown     = 7;
}

message CrossReferenceRequest {
  jarvis.common.RequestMeta meta = 1;
  repeated string subject_ids    = 2;
  string relationship_hint       = 3;
}

message Relationship {
  string subject_a = 1;
  string subject_b = 2;
  string rel_type  = 3;
  float  strength  = 4;
  string evidence  = 5;
}

message CrossReferenceResponse {
  jarvis.common.ResponseMeta meta      = 1;
  repeated Relationship relationships  = 2;
}

message StreamIntelUpdatesRequest {
  jarvis.common.RequestMeta meta = 1;
}

message StreamIntelUpdatesResponse {
  jarvis.common.ResponseMeta meta = 1;
  QueryIntelResponse update       = 2;
}

// ── Intel Hunt messages ───────────────────────────────────────────────────────

// RawSignal is an unprocessed piece of intelligence from any source.
message RawSignal {
  string     id          = 1;
  SourceType source_type = 2;
  string     raw_content = 3;
  string     source_uri  = 4; // feed URL, filename, or empty for manual
  google.protobuf.Timestamp ingested_at = 5;
}

// IntelCard is a structured intelligence opportunity produced by the FusionEngine.
message IntelCard {
  string          id               = 1;
  string          title            = 2;
  string          summary          = 3;
  OpportunityType opportunity_type = 4;
  float           confidence_score = 5;
  string          suggested_action = 6;
  IntelCardStatus status           = 7;
  repeated string raw_signal_ids   = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message IngestSignalRequest {
  jarvis.common.RequestMeta meta = 1;
  SourceType source_type         = 2;
  string     raw_content         = 3;
  string     source_uri          = 4; // optional — feed URL or filename
}

message IngestSignalResponse {
  jarvis.common.ResponseMeta meta = 1;
  RawSignal signal                = 2;
  IntelCard card                  = 3; // generated card; status PENDING_REVIEW
}

message ListIntelCardsRequest {
  jarvis.common.RequestMeta meta   = 1;
  IntelCardStatus status_filter    = 2; // UNSPECIFIED = return all statuses
  int32           page_size        = 3;
  string          page_token       = 4;
}

message ListIntelCardsResponse {
  jarvis.common.ResponseMeta meta = 1;
  repeated IntelCard cards        = 2;
  string next_page_token          = 3;
  int32  total_count              = 4;
}

message ConfirmActionRequest {
  jarvis.common.RequestMeta meta = 1;
  string          card_id        = 2;
  IntelCardStatus new_status     = 3; // CONFIRMED or DISMISSED
}

message ConfirmActionResponse {
  jarvis.common.ResponseMeta meta = 1;
  IntelCard card                  = 2;
}

// ── Service ───────────────────────────────────────────────────────────────────

service IntelligenceService {
  rpc QueryIntel(QueryIntelRequest) returns (QueryIntelResponse) {
    option (google.api.http) = { post: "/v1/intel/query" body: "*" };
  }
  rpc AnalyzeArtifact(AnalyzeArtifactRequest) returns (AnalyzeArtifactResponse) {
    option (google.api.http) = { post: "/v1/intel/artifact" body: "*" };
  }
  rpc CrossReference(CrossReferenceRequest) returns (CrossReferenceResponse) {
    option (google.api.http) = { post: "/v1/intel/crossref" body: "*" };
  }
  rpc StreamIntelUpdates(StreamIntelUpdatesRequest) returns (stream StreamIntelUpdatesResponse);

  // ── Intel Hunt RPCs ──────────────────────────────────────────────
  rpc IngestSignal(IngestSignalRequest) returns (IngestSignalResponse) {
    option (google.api.http) = { post: "/v1/intel/signals" body: "*" };
  }
  rpc ListIntelCards(ListIntelCardsRequest) returns (ListIntelCardsResponse) {
    option (google.api.http) = { get: "/v1/intel/cards" };
  }
  rpc ConfirmAction(ConfirmActionRequest) returns (ConfirmActionResponse) {
    option (google.api.http) = { post: "/v1/intel/cards/{card_id}/confirm" body: "*" };
  }
}
