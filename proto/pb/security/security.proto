syntax = "proto3";
package jarvis.security;
option go_package = "github.com/rkrimper1/jarvis/api/pb/security";

import "pb/common/common.proto";
import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";

enum AuthMethod {
  AUTH_METHOD_UNSPECIFIED  = 0;
  AUTH_METHOD_VOICE_PRINT  = 1;
  AUTH_METHOD_RETINAL_SCAN = 2;
  AUTH_METHOD_TOKEN        = 3;
  AUTH_METHOD_BIOMETRIC    = 4;
  AUTH_METHOD_PASSCODE     = 5;
}

enum ThreatLevel {
  THREAT_LEVEL_UNSPECIFIED = 0;
  THREAT_LEVEL_LOW         = 1;
  THREAT_LEVEL_MODERATE    = 2;
  THREAT_LEVEL_HIGH        = 3;
  THREAT_LEVEL_CRITICAL    = 4;
}

enum ProtocolType {
  PROTOCOL_TYPE_UNSPECIFIED = 0;
  PROTOCOL_TYPE_LOCKDOWN    = 1;
  PROTOCOL_TYPE_EVACUATION  = 2;
  PROTOCOL_TYPE_CLEAN_SLATE = 3;
  PROTOCOL_TYPE_BLACKOUT    = 4;
}

message AuthenticateRequest {
  jarvis.common.RequestMeta meta = 1;
  string     subject_id         = 2;
  AuthMethod method             = 3;
  bytes      credential_payload = 4;
}

message AuthenticateResponse {
  jarvis.common.ResponseMeta meta = 1;
  bool     authenticated          = 2;
  string   access_token           = 3;
  repeated string granted_scopes  = 4;
  google.protobuf.Timestamp expires_at = 5;
}

message AssessThreatRequest {
  jarvis.common.RequestMeta meta    = 1;
  string   subject_id               = 2;
  string   location                 = 3;
  repeated string observed_signals  = 4;
}

message AssessThreatResponse {
  jarvis.common.ResponseMeta meta       = 1;
  ThreatLevel level                     = 2;
  float       confidence                = 3;
  string      threat_summary            = 4;
  repeated string recommended_actions   = 5;
}

message ExecuteProtocolRequest {
  jarvis.common.RequestMeta meta = 1;
  ProtocolType protocol          = 2;
  string       reason            = 3;
  bool         requires_confirmation = 4;
}

message ExecuteProtocolResponse {
  jarvis.common.ResponseMeta meta = 1;
  ProtocolType protocol_executed  = 2;
  repeated string actions_taken   = 3;
}

message GetAuditLogRequest {
  jarvis.common.RequestMeta meta  = 1;
  string subject_id               = 2;
  google.protobuf.Timestamp from  = 3;
  google.protobuf.Timestamp to    = 4;
  int32  page_size                = 5;
  string page_token               = 6;
}

message AuditEntry {
  string event_id   = 1;
  string subject_id = 2;
  string action     = 3;
  string resource   = 4;
  bool   success    = 5;
  google.protobuf.Timestamp timestamp = 6;
}

message SurroundingsStatus {
  double score  = 1; // 0–100
  string color  = 2; // GREEN | YELLOW | RED
  string status = 3; // NOMINAL | COMPROMISED
}

message GetAuditLogResponse {
  jarvis.common.ResponseMeta meta      = 1;
  repeated AuditEntry entries          = 2;
  string next_page_token               = 3;
  SurroundingsStatus surroundings_status = 4;
}

message SecurityAlert {
  string      alert_id  = 1;
  ThreatLevel level     = 2;
  string      message   = 3;
  string      source    = 4;
  google.protobuf.Timestamp timestamp = 5;
}

message StreamSecurityAlertsRequest {
  jarvis.common.RequestMeta meta = 1;
}

message StreamSecurityAlertsResponse {
  jarvis.common.ResponseMeta meta = 1;
  SecurityAlert alert             = 2;
}

// ── Threat scene analysis (Claude Vision) ─────────────────────────────────────

message AnalyzeThreatSceneRequest {
  jarvis.common.RequestMeta meta      = 1;
  bytes  image_data                   = 2; // JPEG or PNG frame from camera
  repeated string detected_objects    = 3; // optional: client-side COCO-SSD labels e.g. ["person(0.91)","knife(0.78)"]
}

message AnalyzeThreatSceneResponse {
  jarvis.common.ResponseMeta meta       = 1;
  ThreatLevel   level                   = 2;
  float         confidence              = 3; // 0–1
  string        threat_summary          = 4;
  repeated string recommended_actions   = 5;
  string        log_mode                = 6; // mirrors THREAT_LOG_MODE: "auto"|"manual"|"all"
}

// ── Threat event persistence ───────────────────────────────────────────────────

message ThreatEvent {
  string   event_id                    = 1;
  google.protobuf.Timestamp timestamp  = 2;
  string   camera_label               = 3;
  repeated string detected_objects    = 4;
  ThreatLevel level                   = 5;
  float    confidence                 = 6;
  string   threat_summary             = 7;
  repeated string recommended_actions = 8;
  string   image_url                  = 9; // empty if THREAT_LOG_IMAGES=false
}

message LogThreatEventRequest {
  jarvis.common.RequestMeta meta      = 1;
  string   camera_label               = 2;
  repeated string detected_objects    = 3;
  ThreatLevel level                   = 4;
  float    confidence                 = 5;
  string   threat_summary             = 6;
  repeated string recommended_actions = 7;
  bytes    image_data                 = 8; // JPEG; only stored if THREAT_LOG_IMAGES=true
  bool     force                      = 9; // true = explicit manual log request
}

message LogThreatEventResponse {
  jarvis.common.ResponseMeta meta = 1;
  ThreatEvent event               = 2;
  bool        logged              = 3; // false when mode="manual" and force=false
}

message ListThreatEventsRequest {
  jarvis.common.RequestMeta meta = 1;
  int32  page_size               = 2;
}

message ListThreatEventsResponse {
  jarvis.common.ResponseMeta meta  = 1;
  repeated ThreatEvent events      = 2;
}

// ── Face analysis ─────────────────────────────────────────────────────────────

message BoundingBox {
  int32 x      = 1;
  int32 y      = 2;
  int32 width  = 3;
  int32 height = 4;
}

message FaceAnalysis {
  int32       face_index   = 1;
  string      sentiment    = 2;
  string      commentary   = 3;
  BoundingBox bounding_box = 4;
}

message AnalyzeFacesRequest {
  jarvis.common.RequestMeta meta = 1;
  bytes  image_data              = 2; // raw image bytes (JPEG or PNG)
  string filename                = 3; // original filename hint
}

message AnalyzeFacesResponse {
  jarvis.common.ResponseMeta meta = 1;
  string         image_url        = 2; // e.g. /faces/annotated_xxx.png
  int32          face_count       = 3;
  repeated FaceAnalysis faces     = 4;
}

service SecurityService {
  rpc Authenticate(AuthenticateRequest) returns (AuthenticateResponse) {
    option (google.api.http) = { post: "/v1/security/authenticate" body: "*" };
  }
  rpc AssessThreat(AssessThreatRequest) returns (AssessThreatResponse) {
    option (google.api.http) = { post: "/v1/security/threat" body: "*" };
  }
  rpc ExecuteProtocol(ExecuteProtocolRequest) returns (ExecuteProtocolResponse) {
    option (google.api.http) = { post: "/v1/security/protocol" body: "*" };
  }
  rpc GetAuditLog(GetAuditLogRequest) returns (GetAuditLogResponse) {
    option (google.api.http) = { get: "/v1/security/audit" };
  }
  rpc AnalyzeFaces(AnalyzeFacesRequest) returns (AnalyzeFacesResponse) {
    option (google.api.http) = { post: "/v1/security/faces" body: "*" };
  }
  rpc AnalyzeThreatScene(AnalyzeThreatSceneRequest) returns (AnalyzeThreatSceneResponse) {
    option (google.api.http) = { post: "/v1/security/threat-scene" body: "*" };
  }
  rpc LogThreatEvent(LogThreatEventRequest) returns (LogThreatEventResponse) {
    option (google.api.http) = { post: "/v1/security/threat-events" body: "*" };
  }
  rpc ListThreatEvents(ListThreatEventsRequest) returns (ListThreatEventsResponse) {
    option (google.api.http) = { get: "/v1/security/threat-events" };
  }
  rpc StreamSecurityAlerts(StreamSecurityAlertsRequest) returns (stream StreamSecurityAlertsResponse);
}
