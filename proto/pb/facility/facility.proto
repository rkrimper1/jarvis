syntax = "proto3";
package jarvis.facility;
option go_package = "github.com/rkrimper1/jarvis/api/pb/facility";

import "pb/common/common.proto";
import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";

enum ZoneType {
  ZONE_TYPE_UNSPECIFIED = 0;
  ZONE_TYPE_LAB         = 1;
  ZONE_TYPE_WORKSHOP    = 2;
  ZONE_TYPE_RESIDENCE   = 3;
  ZONE_TYPE_SERVER_ROOM = 4;
  ZONE_TYPE_HANGAR      = 5;
  ZONE_TYPE_PERIMETER   = 6;
}

enum SystemType {
  SYSTEM_TYPE_UNSPECIFIED  = 0;
  SYSTEM_TYPE_LIGHTING     = 1;
  SYSTEM_TYPE_HVAC         = 2;
  SYSTEM_TYPE_POWER        = 3;
  SYSTEM_TYPE_ACCESS_DOORS = 4;
  SYSTEM_TYPE_CAMERAS      = 5;
  SYSTEM_TYPE_COMMS        = 6;
}

message Zone {
  string   zone_id     = 1;
  string   name        = 2;
  ZoneType type        = 3;
  string   building_id = 4;
  int32    floor       = 5;
  repeated string active_systems = 6;
}

message EnvironmentReading {
  string zone_id          = 1;
  float  temperature_c    = 2;
  float  humidity_pct     = 3;
  float  air_quality      = 4;
  string composition      = 5;
  bool   anomaly_detected = 6;
  google.protobuf.Timestamp timestamp = 7;
}

message ControlSystemRequest {
  jarvis.common.RequestMeta meta = 1;
  string     zone_id             = 2;
  SystemType system              = 3;
  string     command             = 4;
  map<string, string> settings   = 5;
}

message ControlSystemResponse {
  jarvis.common.ResponseMeta meta = 1;
  string     zone_id              = 2;
  SystemType system               = 3;
  string     new_state            = 4;
  repeated string side_effects    = 5;
}

message ManageAccessRequest {
  jarvis.common.RequestMeta meta = 1;
  string subject_id              = 2;
  string zone_id                 = 3;
  string action                  = 4;
}

message ManageAccessResponse {
  jarvis.common.ResponseMeta meta = 1;
  bool   access_granted           = 2;
  string reason                   = 3;
  google.protobuf.Timestamp valid_until = 4;
}

message GetEnvironmentReadingRequest {
  jarvis.common.RequestMeta meta = 1;
  string zone_id                 = 2;
}

message GetEnvironmentReadingResponse {
  jarvis.common.ResponseMeta meta = 1;
  EnvironmentReading reading      = 2;
}

message StreamEnvironmentRequest {
  jarvis.common.RequestMeta meta = 1;
  string zone_id                 = 2;
}

message StreamEnvironmentResponse {
  jarvis.common.ResponseMeta meta = 1;
  EnvironmentReading reading      = 2;
}

message AlexaDevice {
  string serial_number         = 1;
  string name                  = 2;
  string device_family         = 3; // ECHO, TABLET, WHA, UNKNOWN
  string device_type           = 4; // manufacturer/model description
  bool   online                = 5;
  bool   is_smart_home         = 6; // true → appliance; supports SendAlexaCommand
  string appliance_id          = 7; // populated for smart home devices
  repeated string capabilities = 8; // LIGHT, THERMOSTAT, LOCK, SWITCH, etc.
  string power_state           = 9; // ON, OFF, or empty if unknown
}

message ListAlexaDevicesRequest {
  jarvis.common.RequestMeta meta = 1;
}

message ListAlexaDevicesResponse {
  jarvis.common.ResponseMeta meta    = 1;
  repeated AlexaDevice       devices = 2;
}

message SendAlexaCommandRequest {
  jarvis.common.RequestMeta meta     = 1;
  string appliance_id                = 2;
  string action                      = 3; // turnOn, turnOff, setBrightness, setTargetTemperature, lock, unlock
  map<string, string> parameters     = 4; // e.g. brightness=50, targetTemperature=72
}

message SendAlexaCommandResponse {
  jarvis.common.ResponseMeta meta = 1;
}

service FacilityService {
  rpc ControlSystem(ControlSystemRequest) returns (ControlSystemResponse) {
    option (google.api.http) = { post: "/v1/facility/zones/{zone_id}/system" body: "*" };
  }
  rpc ManageAccess(ManageAccessRequest) returns (ManageAccessResponse) {
    option (google.api.http) = { post: "/v1/facility/zones/{zone_id}/access" body: "*" };
  }
  rpc GetEnvironmentReading(GetEnvironmentReadingRequest) returns (GetEnvironmentReadingResponse) {
    option (google.api.http) = { get: "/v1/facility/zones/{zone_id}/environment" };
  }
  rpc StreamEnvironment(StreamEnvironmentRequest) returns (stream StreamEnvironmentResponse);
  rpc ListAlexaDevices(ListAlexaDevicesRequest) returns (ListAlexaDevicesResponse) {
    option (google.api.http) = { get: "/v1/facility/alexa/devices" };
  }
  rpc SendAlexaCommand(SendAlexaCommandRequest) returns (SendAlexaCommandResponse) {
    option (google.api.http) = { post: "/v1/facility/alexa/command" body: "*" };
  }
}
