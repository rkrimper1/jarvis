syntax = "proto3";
package jarvis.learning;
option go_package = "github.com/rkrimper1/jarvis/api/pb/learning";

import "pb/common/common.proto";
import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";

enum FeedbackType {
  FEEDBACK_TYPE_UNSPECIFIED = 0;
  FEEDBACK_TYPE_POSITIVE    = 1;
  FEEDBACK_TYPE_NEGATIVE    = 2;
  FEEDBACK_TYPE_CORRECTION  = 3;
}

enum ModelDomain {
  MODEL_DOMAIN_UNSPECIFIED = 0;
  MODEL_DOMAIN_NLP         = 1;
  MODEL_DOMAIN_THREAT      = 2;
  MODEL_DOMAIN_HARDWARE    = 3;
  MODEL_DOMAIN_BEHAVIOR    = 4;
}

message SubmitFeedbackRequest {
  jarvis.common.RequestMeta meta = 1;
  string       interaction_id   = 2;
  FeedbackType feedback_type    = 3;
  string       correction       = 4;
  float        rating           = 5;
  string       notes            = 6;
}

message SubmitFeedbackResponse {
  jarvis.common.ResponseMeta meta = 1;
  bool   queued_for_training      = 2;
  string feedback_id              = 3;
}

message GetBehaviorProfileRequest {
  jarvis.common.RequestMeta meta = 1;
  string subject_id              = 2;
}

message GetBehaviorProfileResponse {
  jarvis.common.ResponseMeta meta  = 1;
  string subject_id               = 2;
  map<string, float> trait_scores = 3;
  repeated string preferred_interaction_patterns = 4;
  google.protobuf.Timestamp profile_updated_at   = 5;
}

message GetModelPerformanceRequest {
  jarvis.common.RequestMeta meta = 1;
  ModelDomain domain             = 2;
  google.protobuf.Timestamp from = 3;
  google.protobuf.Timestamp to   = 4;
}

message GetModelPerformanceResponse {
  jarvis.common.ResponseMeta meta      = 1;
  ModelDomain domain                   = 2;
  float accuracy                       = 3;
  float precision                      = 4;
  float recall                         = 5;
  int64 total_inferences               = 6;
  repeated string degradation_warnings = 7;
}

message AdaptationEvent {
  string      event_id       = 1;
  ModelDomain domain         = 2;
  string      description    = 3;
  float       delta_accuracy = 4;
  google.protobuf.Timestamp timestamp = 5;
}

message StreamAdaptationEventsRequest {
  jarvis.common.RequestMeta meta = 1;
}

message StreamAdaptationEventsResponse {
  jarvis.common.ResponseMeta meta = 1;
  AdaptationEvent event           = 2;
}

enum KnowledgeSource {
  KNOWLEDGE_SOURCE_UNSPECIFIED = 0;
  KNOWLEDGE_SOURCE_WEB_SEARCH  = 1;
  KNOWLEDGE_SOURCE_CLAUDE_API  = 2;
  KNOWLEDGE_SOURCE_MANUAL      = 3;
}

message KnowledgeEntry {
  int64  id         = 1;
  string query      = 2;
  string summary    = 3;
  KnowledgeSource source = 4;
  float  confidence = 5;
  string tags       = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message SearchKnowledgeRequest {
  jarvis.common.RequestMeta meta = 1;
  string query                   = 2;
  // preferred_source is used when needs_confirmation is true and the
  // user has chosen a source in the UI. Omit on the first call.
  KnowledgeSource preferred_source = 3;
  // confirmed signals the user approved an external search after
  // receiving needs_confirmation = true on a prior call.
  bool confirmed = 4;
}

message SearchKnowledgeResponse {
  jarvis.common.ResponseMeta meta        = 1;
  repeated KnowledgeEntry    results     = 2;
  // needs_confirmation is true when no fresh DB results exist and an
  // external search is available but has not yet been approved.
  bool             needs_confirmation    = 3;
  KnowledgeSource  suggested_source      = 4;
  // searches_remaining is the number of external searches left in this session.
  int32            searches_remaining    = 5;
}

service LearningService {
  rpc SubmitFeedback(SubmitFeedbackRequest) returns (SubmitFeedbackResponse) {
    option (google.api.http) = { post: "/v1/learning/feedback" body: "*" };
  }
  rpc GetBehaviorProfile(GetBehaviorProfileRequest) returns (GetBehaviorProfileResponse) {
    option (google.api.http) = { get: "/v1/learning/profile/{subject_id}" };
  }
  rpc GetModelPerformance(GetModelPerformanceRequest) returns (GetModelPerformanceResponse) {
    option (google.api.http) = { get: "/v1/learning/performance" };
  }
  rpc StreamAdaptationEvents(StreamAdaptationEventsRequest) returns (stream StreamAdaptationEventsResponse);
  rpc SearchKnowledge(SearchKnowledgeRequest) returns (SearchKnowledgeResponse) {
    option (google.api.http) = { post: "/v1/learning/knowledge/search" body: "*" };
  }
}
