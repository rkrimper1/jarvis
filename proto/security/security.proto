syntax = "proto3";
package jarvis.security;
option go_package = "github.com/rkrimper1/jarvis/gen/security";

import "common/common.proto";
import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";

enum AuthMethod {
  AUTH_UNSPECIFIED  = 0;
  AUTH_VOICE_PRINT  = 1;
  AUTH_RETINAL_SCAN = 2;
  AUTH_TOKEN        = 3;
  AUTH_BIOMETRIC    = 4;
  AUTH_PASSCODE     = 5;
}

enum ThreatLevel {
  THREAT_NONE     = 0;
  THREAT_LOW      = 1;
  THREAT_MODERATE = 2;
  THREAT_HIGH     = 3;
  THREAT_CRITICAL = 4;
}

enum ProtocolType {
  PROTOCOL_UNSPECIFIED = 0;
  PROTOCOL_LOCKDOWN    = 1;
  PROTOCOL_EVACUATION  = 2;
  PROTOCOL_CLEAN_SLATE = 3;
  PROTOCOL_BLACKOUT    = 4;
}

message AuthRequest {
  jarvis.common.RequestMeta meta = 1;
  string     subject_id         = 2;
  AuthMethod method             = 3;
  bytes      credential_payload = 4;
}

message AuthResponse {
  jarvis.common.ResponseMeta meta = 1;
  bool     authenticated          = 2;
  string   access_token           = 3;
  repeated string granted_scopes  = 4;
  google.protobuf.Timestamp expires_at = 5;
}

message ThreatAssessmentRequest {
  jarvis.common.RequestMeta meta    = 1;
  string   subject_id               = 2;
  string   location                 = 3;
  repeated string observed_signals  = 4;
}

message ThreatAssessmentResponse {
  jarvis.common.ResponseMeta meta       = 1;
  ThreatLevel level                     = 2;
  float       confidence                = 3;
  string      threat_summary            = 4;
  repeated string recommended_actions   = 5;
}

message ProtocolRequest {
  jarvis.common.RequestMeta meta = 1;
  ProtocolType protocol          = 2;
  string       reason            = 3;
  bool         requires_confirmation = 4;
}

message ProtocolResponse {
  jarvis.common.ResponseMeta meta = 1;
  ProtocolType protocol_executed  = 2;
  repeated string actions_taken   = 3;
}

message AuditLogRequest {
  jarvis.common.RequestMeta meta  = 1;
  string subject_id               = 2;
  google.protobuf.Timestamp from  = 3;
  google.protobuf.Timestamp to    = 4;
  int32  page_size                = 5;
  string page_token               = 6;
}

message AuditEntry {
  string event_id   = 1;
  string subject_id = 2;
  string action     = 3;
  string resource   = 4;
  bool   success    = 5;
  google.protobuf.Timestamp timestamp = 6;
}

message AuditLogResponse {
  jarvis.common.ResponseMeta meta = 1;
  repeated AuditEntry entries     = 2;
  string next_page_token          = 3;
}

message SecurityAlert {
  string      alert_id  = 1;
  ThreatLevel level     = 2;
  string      message   = 3;
  string      source    = 4;
  google.protobuf.Timestamp timestamp = 5;
}

service SecurityService {
  rpc Authenticate(AuthRequest) returns (AuthResponse) {
    option (google.api.http) = { post: "/v1/security/authenticate" body: "*" };
  }
  rpc AssessThreat(ThreatAssessmentRequest) returns (ThreatAssessmentResponse) {
    option (google.api.http) = { post: "/v1/security/threat" body: "*" };
  }
  rpc ExecuteProtocol(ProtocolRequest) returns (ProtocolResponse) {
    option (google.api.http) = { post: "/v1/security/protocol" body: "*" };
  }
  rpc GetAuditLog(AuditLogRequest) returns (AuditLogResponse) {
    option (google.api.http) = { get: "/v1/security/audit" };
  }
  rpc StreamSecurityAlerts(jarvis.common.RequestMeta) returns (stream ThreatAssessmentResponse);
}
